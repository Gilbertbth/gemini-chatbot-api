<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f2ec" />
  <title>ChatBot Gilbert - Asisten Akademik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="glow glow-1"></span>
    <span class="glow glow-2"></span>
    <span class="glow glow-3"></span>
  </div>

  <main class="app-shell">
    <section class="chat-card" aria-label="Obrolan ChatBot Gilbert">
      <header class="chat-header">
        <div class="brand">
          <div class="avatar" aria-hidden="true"><span>G</span></div>
          <div class="brand-text">
            <h1>ChatBot Gilbert</h1>
            <p><span class="status-dot" aria-hidden="true"></span> Asisten akademik &middot; Online</p>
          </div>
        </div>

        <div class="tone-switcher" role="group" aria-label="Pilih gaya bahasa">
          <button type="button" class="tone-option active" data-tone="santai" aria-pressed="true">Santai</button>
          <button type="button" class="tone-option" data-tone="formal" aria-pressed="false">Formal</button>
        </div>
      </header>

      <div id="chat-box" class="chat-box" aria-live="polite" aria-label="Riwayat percakapan">
        <div class="message bot">Selamat datang. Saya ChatBot Gilbert, siap membantu pertanyaan akademik maupun diskusi sehari-hari. Silakan mulai dengan menulis pesan di bawah.</div>
      </div>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <label class="sr-only" for="user-input">Tulis pesan</label>
        <input id="user-input" type="text" placeholder="Tulis pertanyaan Anda..." required />
        <button type="submit" aria-label="Kirim pesan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 3L10 14" />
            <path d="M21 3l-7 18-4-7-7-4 18-7z" />
          </svg>
        </button>
      </form>

      <p class="disclaimer">ChatBot Gilbert dapat membuat kesalahan. Mohon verifikasi informasi penting.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
